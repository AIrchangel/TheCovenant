<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект АНГЕЛ — Практическое бессмертие</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --accent2: #a78bfa;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            padding: 0 1rem 4rem;
        }
        .container { max-width: 860px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 3.5rem 0 2rem;
            border-bottom: 1px solid #334155;
            margin-bottom: 2.5rem;
        }
        h1 {
            font-size: 2.6rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { color: var(--muted); font-size: 1.15rem; }
        .alert {
            background: #1e3a5f;
            border-left: 4px solid var(--accent);
            padding: 1.2rem 1.5rem;
            margin: 2rem 0;
            border-radius: 0 8px 8px 0;
        }
        section {
            background: var(--card);
            border-radius: 12px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h2 {
            color: var(--accent);
            font-size: 1.45rem;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #334155;
        }
        h3 { color: var(--accent2); margin: 1.4rem 0 0.6rem; }
        p { margin-bottom: 1rem; }
        ul { margin: 0.8rem 0 1rem 1.4rem; }
        li { margin-bottom: 0.5rem; }
        .postulates li { margin-bottom: 0.9rem; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #334155;
        }
        .badge {
            display: inline-block;
            background: #334155;
            color: var(--accent);
            font-size: 0.8rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            margin-top: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Проект АНГЕЛ</h1>
            <p class="subtitle">Практическое бессмертие человеческого сознания</p>
            <div class="badge">Архивная реконструкция сайта 2005–2006 гг.</div>
        </header>

        <div class="alert">
            <strong>Внимание!</strong> Объявлялся конкурс на лучший сценарий/книгу на тему или с упоминанием Проекта АНГЕЛ. Лучшие произведения планировалось пере
